name: taverna-bot

services:
  redis:
    image: docker.io/valkey/valkey:9-alpine
    container_name: taverna-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: docker.io/library/rabbitmq:3-management-alpine
    container_name: taverna-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: taverna
      RABBITMQ_DEFAULT_PASS: taverna
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mongodb:
    image: docker.io/library/mongo:8
    container_name: taverna-mongodb
    restart: unless-stopped
    environment:
      GLIBC_TUNABLES: "glibc.cpu.hwcaps=-SHSTK"
    command:
      - mongod
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.5"
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: [ 'CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  redis-data:
  rabbitmq-data:
  mongodb-data:
  mongodb-config: